name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs on the same ref are pointless — cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast gate: no database needed, so it fails in ~1 minute on the common errors.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` runs the postinstall `prisma generate` (no DB needed).
      - name: Install
        run: npm ci

      # Gate on the PRODUCTION dependency tree only. Dev-only advisories (today:
      # brace-expansion via eslint's minimatch@3) have no runtime exposure and
      # can't be fixed without breaking eslint, so they must not block a release.
      - name: Audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Lint
        run: npx eslint .

  # `next build` prerenders pages that read from MSSQL, so it needs a real
  # database. Without this job the production build was first exercised on the
  # live server during a release — a build failure left the VPS mid-deploy.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify

    services:
      # Job-level `env:` is not available in a service definition, so the
      # password is written literally here and mirrored in `env:` below.
      # It is a throwaway CI credential, not a secret.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Ci_Str0ng_Pass!2026'
        ports:
          - 1433:1433

    env:
      SA_PASSWORD: 'Ci_Str0ng_Pass!2026'
      DATABASE_URL: 'sqlserver://localhost:1433;database=jilber_ci;user=sa;password=Ci_Str0ng_Pass!2026;encrypt=true;trustServerCertificate=true'
      # 32+ chars — instrumentation.ts fails fast otherwise. CI-only value.
      AUTH_SECRET: 'ci-only-auth-secret-not-used-anywhere-real'
      NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Runs sqlcmd from a throwaway container on the host network rather than
      # `docker exec` into the service container, which would depend on
      # discovering it by image ancestor. The server image is already pulled, so
      # this costs nothing extra.
      - name: Wait for SQL Server and create the database
        run: |
          set -euo pipefail
          sqlcmd() {
            docker run --rm --network host mcr.microsoft.com/mssql/server:2022-latest \
              /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C "$@"
          }

          for i in $(seq 1 30); do
            if sqlcmd -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is up after ${i} attempt(s)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "SQL Server did not become ready" >&2
              exit 1
            fi
            echo "waiting for SQL Server ($i/30)…"
            sleep 5
          done

          sqlcmd -Q "IF DB_ID('jilber_ci') IS NULL CREATE DATABASE jilber_ci"

      # Exercises the committed migrations, not just the schema file — catches a
      # migration that fails to apply before it does so on production.
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build
