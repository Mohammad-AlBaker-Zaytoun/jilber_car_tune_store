# nginx site config for the JILBER store.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/jilber
#   sudo ln -s /etc/nginx/sites-available/jilber /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d yourdomain.com        # adds the TLS block below
#
# Replace yourdomain.com throughout.

# Rate-limit zones. Defence in depth in FRONT of the app's own limiter
# (lib/rate-limit.ts), which is per-process and resets on every redeploy.
limit_req_zone $binary_remote_addr zone=jilber_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=jilber_api:10m  rate=60r/m;

# Required by the Connection header in proxy_params_jilber. Site files are
# included inside the http context, so defining the map here is valid.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # certbot manages the redirect to HTTPS once TLS is provisioned.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Must exceed the 5 MB product-image upload limit enforced in
    # app/api/admin/upload/product-image/route.ts.
    client_max_body_size 6m;

    # Don't advertise the nginx version.
    server_tokens off;

    # ---- Uploaded product images -------------------------------------------
    # `next start` will not serve files added to public/ after the build, and a
    # redeploy replaces the app directory. Uploads therefore live outside the
    # build output (UPLOAD_DIR) and are served straight from disk here.
    location /products/uploads/ {
        alias /var/lib/jilber/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        # Never execute anything out of the upload directory.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- Static build assets -----------------------------------------------
    # Content-hashed by Next, so they can be cached forever.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---- Scroll / transition frame sequences --------------------------------
    # ~50 MB of immutable image frames. Without this they revalidate on every
    # repeat visit (hundreds of conditional requests per page load).
    location ~* ^/(scroll-frames|store-hero-frames|pro-tuning-transition-frames-webp)/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---- Session read: NOT a credential attempt ----------------------------
    # /api/auth/me is a read-only "who am I", called by the auth provider on
    # every page load. In the strict jilber_auth zone (10r/m = one per 6s) it
    # returned 429 after a handful of page views, and a 429 here reads to the
    # client as "not logged in" — customers appeared to be signed out while
    # shopping. Measured on the live site: 8 calls in 16 seconds of ordinary
    # browsing, 2 rejected.
    #
    # An exact-match location takes precedence over the /api/auth/ prefix
    # below, so the credential endpoints keep the tight limit.
    location = /api/auth/me {
        limit_req zone=jilber_api burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params_jilber;
        proxy_pass http://127.0.0.1:3000;
    }

    # ---- Auth endpoints: tighter limit --------------------------------------
    # Deliberately strict: these are the brute-force targets (login, register,
    # forgot-password, reset-password, resend-verification).
    location /api/auth/ {
        limit_req zone=jilber_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params_jilber;
        proxy_pass http://127.0.0.1:3000;
    }

    # ---- Everything else ----------------------------------------------------
    location /api/ {
        limit_req zone=jilber_api burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params_jilber;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        include /etc/nginx/proxy_params_jilber;
        proxy_pass http://127.0.0.1:3000;
    }
}
